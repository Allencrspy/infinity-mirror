<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*{box-sizing:border-box}body{margin:0}</style>
<title>Infinity Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed canvas "mirror box"; a slim control strip floats at the bottom like the LED controller on a real build */
:root {
  --void: #05060a;
  --panel: rgba(14, 16, 24, 0.78);
  --line: rgba(160, 175, 220, 0.16);
  --fg: #e6e9f2;
  --dim: #8a90a6;
  --led: #7cf3ff;
  --display: "Chakra Petch", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void); color: var(--fg); font-family: var(--mono);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
}
canvas { touch-action: none; position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: fixed; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  pointer-events: none;
}
.hud h1 { margin: 0; font: 600 15px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; }
.readout { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
.readout b { color: var(--fg); font-weight: 500; }

.dock {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%); width: min(560px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  padding: 10px; display: grid; gap: 8px; transition: opacity .4s, transform .4s;
}
.hud { transition: opacity .4s; }
body.clean .hud { opacity: 0; }
.hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); pointer-events: none; transition: opacity 1s; }
.hint.gone { opacity: 0; }
.dock.tucked { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); width: 52px; flex: none; }
.seg { display: flex; gap: 4px; flex: 1; min-width: 0; }
.seg button, .btn {
  flex: 1; min-width: 0; font: 500 12px var(--mono); color: var(--fg);
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 4px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { border-color: var(--led); color: var(--led); box-shadow: inset 0 0 12px rgba(124,243,255,.15); }
.btn.primary { border-color: var(--led); color: var(--void); background: var(--led); font-weight: 600; }
button:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--led); }
.note { font-size: 11px; color: var(--dim); line-height: 1.45; margin: 0; }
.note[data-tone="warn"] { color: #ffc38a; }
</style>

<canvas id="c"></canvas>

<div class="hint" id="hint">Tap for settings</div>
<div class="hud">
  <h1>Infinity Mirror</h1>
  <div class="readout" id="readout">tilt <b>β 0°</b> <b>γ 0°</b><br>source <b>touch</b></div>
</div>

<div class="dock tucked" id="dock">
  <div class="row">
    <button class="btn primary" id="sensorBtn">Use motion sensors</button>
    <button class="btn" id="hideBtn" style="flex:0 0 auto;padding-inline:14px">Hide</button>
  </div>
  <p class="note" id="status">Tilt the phone (or drag) to look into the mirror. Tap anywhere to show or hide this menu.</p>
  <div class="row"><span class="lbl">Frame</span>
    <div class="seg" data-key="shape">
      <button data-v="square" aria-pressed="true">Square</button>
      <button data-v="circle">Circle</button>
      <button data-v="hex">Hex</button>
      <button data-v="tri">Tri</button>
    </div>
  </div>
  <div class="row"><span class="lbl">LEDs</span>
    <div class="seg" data-key="mode">
      <button data-v="chase" aria-pressed="true">Rainbow</button>
      <button data-v="ice">Ice</button>
      <button data-v="ember">Ember</button>
      <button data-v="compass">Compass</button>
    </div>
  </div>
  <div class="row"><span class="lbl">Silver</span>
    <input type="range" id="refl" min="70" max="96" value="88" aria-label="Mirror reflectivity">
    <span class="readout" id="reflOut" style="width:34px">88%</span>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const readout = document.getElementById('readout');
  const statusEl = document.getElementById('status');
  const dock = document.getElementById('dock');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state = { shape: 'square', mode: 'chase', refl: 0.88 };
  let W = 0, H = 0, DPR = 1;
  // tilt target/current in degrees; heading for compass mode
  let tx = 0, ty = 0, cx = 0, cy = 0, heading = 0, source = 'touch';
  let shakeKick = 0, lastShake = 0;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // Pre-rendered glow sprite (white, tinted per LED with globalCompositeOperation)
  const SPR = 64;
  const sprites = new Map();
  function sprite(hue, sat, light) {
    const key = `${hue|0}-${sat}-${light}`;
    let s = sprites.get(key);
    if (s) return s;
    s = document.createElement('canvas'); s.width = s.height = SPR;
    const g = s.getContext('2d');
    const grd = g.createRadialGradient(SPR/2, SPR/2, 0, SPR/2, SPR/2, SPR/2);
    grd.addColorStop(0, `hsla(${hue},${sat}%,96%,1)`);
    grd.addColorStop(0.12, `hsla(${hue},${sat}%,${light}%,1)`);
    grd.addColorStop(0.4, `hsla(${hue},${sat}%,${light}%,0.28)`);
    grd.addColorStop(1, `hsla(${hue},${sat}%,${light}%,0)`);
    g.fillStyle = grd; g.fillRect(0, 0, SPR, SPR);
    if (sprites.size > 600) sprites.clear();
    sprites.set(key, s);
    return s;
  }

  // Perimeter point at parameter t∈[0,1) for a unit shape (radius 1)
  function perim(shape, t) {
    if (shape === 'circle') { const a = t * Math.PI * 2 - Math.PI/2; return [Math.cos(a), Math.sin(a)]; }
    if (shape === 'square') return roundRect(t);
    const n = shape === 'hex' ? 6 : shape === 'tri' ? 3 : 4;
    const rot = shape === 'square' ? -Math.PI * 3/4 : -Math.PI/2;
    const seg = t * n, i = Math.floor(seg), f = seg - i;
    const a0 = rot + i / n * Math.PI * 2, a1 = rot + (i + 1) / n * Math.PI * 2;
    const x0 = Math.cos(a0), y0 = Math.sin(a0), x1 = Math.cos(a1), y1 = Math.sin(a1);
    return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f];
  }

  // Rounded rectangle matching the screen (corner radius follows phone screen corners)
  let RX = 1, RY = 1, RC = 0;
  function roundRect(t) {
    const lx = 2 * (RX - RC), ly = 2 * (RY - RC), arc = Math.PI * RC / 2;
    const segs = [lx, arc, ly, arc, lx, arc, ly, arc];
    let L = t * (2 * lx + 2 * ly + 4 * arc), i = 0;
    while (i < 7 && L > segs[i]) { L -= segs[i]; i++; }
    let x, y;
    const ex = RX - RC, ey = RY - RC, a = RC ? L / RC : 0;
    switch (i) {
      case 0: x = -ex + L; y = -RY; break;
      case 1: x = ex + RC * Math.sin(a); y = -ey - RC * Math.cos(a); break;
      case 2: x = RX; y = -ey + L; break;
      case 3: x = ex + RC * Math.cos(a); y = ey + RC * Math.sin(a); break;
      case 4: x = ex - L; y = RY; break;
      case 5: x = -ex - RC * Math.sin(a); y = ey + RC * Math.cos(a); break;
      case 6: x = -RX; y = ey - L; break;
      default: x = -ex - RC * Math.cos(a); y = -ey - RC * Math.sin(a);
    }
    return [x / RX, y / RY];
  }

  function ledColor(i, count, layer, t) {
    const p = i / count;
    switch (state.mode) {
      case 'ice': return [190 + 20 * Math.sin(p * 12 + t * 2), 95, 62];
      case 'ember': return [8 + 30 * (0.5 + 0.5 * Math.sin(p * 18 - t * 3)), 100, 55];
      case 'compass': return [(heading + p * 60 + layer * 4) % 360, 90, 60];
      default: return [(p * 360 + t * 70 + layer * 9) % 360, 95, 60];
    }
  }

  function frame(now) {
    const t = reduced ? 0 : now / 1000;
    cx += (tx - cx) * 0.12; cy += (ty - cy) * 0.12;
    shakeKick *= 0.92;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);

    const R = Math.min(W, H) * 0.5;
    const inset = Math.max(8, R * 0.05);
    const Rx = W / 2 - inset, Ry = H / 2 - inset;   // outer frame hugs the screen edges
    RX = Rx; RY = Ry; RC = Math.min(Rx, Ry) * 0.2;
    const ox = W / 2, oy = H / 2;
    const f = 3.2, d = 0.42;                   // focal length / mirror gap (in R units)
    // tilt → lateral shift per unit depth (tan of viewing angle), clamped
    const sx = Math.tan(Math.max(-60, Math.min(60, cx)) * Math.PI / 180);
    const sy = Math.tan(Math.max(-60, Math.min(60, cy)) * Math.PI / 180);
    // vanishing point: soft-limited so the tunnel never leaves the frame
    const vx = Math.tanh(sx * 2) * Rx * 0.62, vy = Math.tanh(sy * 2) * Ry * 0.62;
    const layers = 34;
    const count = Math.round(Math.min(200, 2 * (Rx + Ry) * (state.shape === 'circle' ? 1.6 : 2) / Math.max(14, R * 0.085)));

    // Dark mirror box edges (the "tunnel walls"): draw last layer outline lines
    ctx.globalCompositeOperation = 'lighter';
    for (let n = layers - 1; n >= 0; n--) {
      const z = n * d;
      const s = f / (f + z);
      const k = z / (f + z);                 // 0 at the glass → 1 at infinity
      const px = ox + vx * k;
      const py = oy + vy * k;
      const bright = Math.pow(state.refl, n);
      if (bright < 0.02) continue;
      const ledR = Math.max(1.2, R * 0.06 * s);
      const pulse = 1 + shakeKick * Math.sin(n * 0.8 - t * 12);
      ctx.globalAlpha = Math.min(1, bright * 1.05);
      for (let i = 0; i < count; i++) {
        const [ux, uy] = perim(state.shape, i / count);
        const x = px + ux * Rx * s * pulse, y = py + uy * Ry * s * pulse;
        const [h, sa, l] = ledColor(i, count, n, t);
        const sp = sprite(Math.round(h / 3) * 3, sa, l);
        const sz = ledR * 2.6;
        ctx.drawImage(sp, x - sz / 2, y - sz / 2, sz, sz);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // Bezel vignette so the front frame reads as glass
    const vg = ctx.createRadialGradient(ox, oy, R * 0.6, ox, oy, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(5,6,10,0)'); vg.addColorStop(1, 'rgba(5,6,10,0.35)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    readout.innerHTML = `tilt <b>β ${cy.toFixed(0).padStart(3, ' ')}°</b> <b>γ ${cx.toFixed(0).padStart(3, ' ')}°</b><br>source <b>${source}</b>`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Touch / mouse fallback ----
  let dragging = false;
  function pointerTilt(e) {
    if (source === 'sensors') return;
    tx = (e.clientX / W - 0.5) * 70;
    ty = (e.clientY / H - 0.5) * 70;
  }
  let downX = 0, downY = 0, downT = 0, hideTimer = 0, firstTap = true;
  const hint = document.getElementById('hint');
  setTimeout(() => hint.classList.add('gone'), 3500);
  document.body.classList.add('clean');
  function showDock(show) {
    dock.classList.toggle('tucked', !show);
    document.body.classList.toggle('clean', !show);
    clearTimeout(hideTimer);
    if (show) hideTimer = setTimeout(() => showDock(false), 6000);
  }
  dock.addEventListener('pointerdown', () => showDock(true));
  dock.addEventListener('input', () => showDock(true));
  cv.addEventListener('pointerdown', e => { dragging = true; downX = e.clientX; downY = e.clientY; downT = performance.now(); pointerTilt(e); });
  addEventListener('pointermove', e => { if (dragging || e.pointerType === 'mouse') pointerTilt(e); });
  cv.addEventListener('pointerup', e => {
    dragging = false;
    const tap = Math.hypot(e.clientX - downX, e.clientY - downY) < 16 && performance.now() - downT < 600;
    if (!tap) return;
    hint.classList.add('gone');
    if (firstTap && source !== 'sensors') { firstTap = false; enableSensors(); }
    showDock(dock.classList.contains('tucked'));
  });
  addEventListener('pointerup', () => { dragging = false; });

  // ---- Sensors ----
  let gotOrientation = false, baseB = null, baseG = null;
  function onOrient(e) {
    if (e.beta == null) return;
    gotOrientation = true; source = 'sensors';
    if (baseB === null) { baseB = e.beta; baseG = e.gamma; }   // calibrate to how you're holding it
    tx = Math.max(-60, Math.min(60, e.gamma - baseG));
    ty = Math.max(-60, Math.min(60, e.beta - baseB));
    const hd = e.webkitCompassHeading ?? (e.alpha != null ? 360 - e.alpha : null);
    if (hd != null) heading = hd;
  }
  function onMotion(e) {
    const a = e.acceleration || e.accelerationIncludingGravity;
    if (!a) return;
    const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    const threshold = e.acceleration ? 14 : 24;
    const now = performance.now();
    if (mag > threshold && now - lastShake > 700) {
      lastShake = now; shakeKick = 0.18;
      const modes = ['chase', 'ice', 'ember', 'compass'];
      setChoice('mode', modes[(modes.indexOf(state.mode) + 1) % modes.length]);
    }
  }

  function setStatus(msg, tone) { statusEl.textContent = msg; statusEl.dataset.tone = tone || ''; }

  document.getElementById('sensorBtn').addEventListener('click', () => enableSensors());
  async function enableSensors() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') throw new Error('denied');
        if (DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission().catch(() => {});
      }
      addEventListener('deviceorientation', onOrient);
      addEventListener('devicemotion', onMotion);
      baseB = baseG = null;
      setStatus('Listening for tilt… hold the phone how you like, it calibrates to that.');
      setTimeout(() => {
        if (!gotOrientation) setStatus('No sensor data came through. This browser or embed blocked motion sensors, so drag on the screen instead.', 'warn');
        else setStatus('Tilt to look around the tunnel. Shake to change colours. Tap the button again to recalibrate.');
      }, 1500);
      try { await navigator.wakeLock?.request('screen'); } catch (_) {}
    } catch (_) {
      setStatus('Motion access was refused here. Drag on the screen to tilt instead.', 'warn');
    }
  }

  document.getElementById('hideBtn').addEventListener('click', () => showDock(false));

  function setChoice(key, v) {
    state[key] = v;
    document.querySelectorAll(`.seg[data-key="${key}"] button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  }
  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) setChoice(seg.dataset.key, b.dataset.v);
  }));
  const refl = document.getElementById('refl'), reflOut = document.getElementById('reflOut');
  refl.addEventListener('input', () => { state.refl = refl.value / 100; reflOut.textContent = refl.value + '%'; });

  // Gentle idle drift so the page shows depth before anyone touches it
  if (!reduced) {
    let idle = true;
    cv.addEventListener('pointerdown', () => idle = false, { once: true });
    (function drift(ts) {
      if (idle && source !== 'sensors') { tx = Math.sin(ts / 2200) * 18; ty = Math.cos(ts / 2900) * 12; }
      if (idle) requestAnimationFrame(drift);
    })(0);
  }
})();
</script>

</html>
